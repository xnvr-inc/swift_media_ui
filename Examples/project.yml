name: MediaUIDemo
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
    macOS: "14.0"
packages:
  MediaUI:
    path: ..
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: dev.xnvr.swift-media-ui.demo
    PRODUCT_NAME: MediaUIDemo
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Swift Media UI
    CODE_SIGN_STYLE: Automatic
targetTemplates:
  Demo:
    type: application
    sources:
      - path: MediaUIDemo
        excludes: [Samples]
      - path: MediaUIDemo/Samples
        type: folder
    dependencies:
      - package: MediaUI
targets:
  MediaUIDemo-iOS:
    templates: [Demo]
    platform: iOS
    info:
      path: Info/iOS.plist
      properties:
        UIBackgroundModes: [audio]
    sources:
      - path: Icons/Xnvr.icon
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: Xnvr
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  MediaUIDemo-macOS:
    templates: [Demo]
    platform: macOS
    sources:
      - path: Icons/Xnvr.icon
    settings:
      base:
        PRODUCT_NAME: Swift Media UI
        ASSETCATALOG_COMPILER_APPICON_NAME: Xnvr
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
  MediaUIDemo-tvOS:
    templates: [Demo]
    platform: tvOS
    sources:
      - path: Icons/TVIcons.xcassets
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  MediaUIDemo-iOS:
    build:
      targets:
        MediaUIDemo-iOS: all
  MediaUIDemo-macOS:
    build:
      targets:
        MediaUIDemo-macOS: all
  MediaUIDemo-tvOS:
    build:
      targets:
        MediaUIDemo-tvOS: all
